rand_chacha = { workspace = true }
parquet = { version = "53.4.1", default-features = false, features = ["arrow"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
arrow-array = "53.4.1"
arrow-schema = "53.4.1"
