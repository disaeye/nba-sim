[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/cli",
    "crates/debug-server",
    "crates/bball-wasm",
    "crates/sim",
    "crates/validation",
]
[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
glam = "0.24"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
rand_chacha = "0.3"
rayon = "1.10"
wasm-bindgen = "0.2"

# Internal crates
nba-domain = { path = "crates/domain" }
nba-protocol = { path = "crates/protocol" }
nba-sim-core = { path = "crates/sim" }
nba-validation = { path = "crates/validation" }

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
