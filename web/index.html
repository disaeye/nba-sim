<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据回放台 · Trace Replay Console</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="stage-debugger stealth">
  <div class="workbench">
    <!-- Top Header -->
    <header class="top-nav">
      <div class="brand">
        <span class="logo" id="brandLogo">◍</span>
        <strong id="brandName">TraceLab</strong>
        <span class="badge" id="brandBadge">Replay &amp; Annotation</span>
      </div>
      <div class="match-info">
        <span class="team home"><span class="pill" id="homePill" style="background:#3b82f6"></span> <span id="homeTeamName">A 组</span> <b id="homeScore">0</b></span>
        <span class="vs">:</span>
        <span class="team away"><b id="awayScore">0</b> <span id="awayTeamName">B 组</span> <span class="pill" id="awayPill" style="background:#a855f7"></span></span>
        <span class="clock-badge" id="matchClock">T1 12:00</span>
      </div>
      <div class="nav-controls">
        <button id="btnPlay" class="btn primary">▶ 播放</button>
        <button id="btnPrevFrame" class="btn">⏮ 上一帧</button>
        <button id="btnNextFrame" class="btn">⏭ 下一帧</button>
        <button id="btnLoopStage" class="btn active">🔁 循环: 开</button>
        <button id="btnStealth" class="btn active" title="切换显示风格">◍ 极简: 开</button>
      </div>
    </header>

    <!-- Mobile Navigation Switcher Bar -->
    <nav class="mobile-tab-bar">
      <button class="mobile-tab-btn" id="mTabStages">📋 阶段序列</button>
      <button class="mobile-tab-btn active" id="mTabCourt">▦ 场景视图</button>
      <button class="mobile-tab-btn" id="mTabDecision">🧠 代理决策</button>
      <button class="mobile-tab-btn" id="mTabAnnotate">✍️ 反馈标注</button>
    </nav>

    <div class="main-layout">
      <aside class="stage-rail">
        <div class="panel-header">
          <h3><span id="railTitleLabel">阶段序列</span> (<span id="possessionCount">0</span>)</h3>
          <span class="sub">点击条目直达与循环回放</span>
        </div>
        <div class="stage-list" id="possessionList">
          <!-- Dynamically populated possessions -->
        </div>
      </aside>

      <!-- Center: Court Workspace (点击 banner 可隐藏/显示卡片) -->
      <main class="court-workspace" id="courtWorkspace">
        <div class="stage-banner" id="currentStageBanner" title="点击隐藏/显示场景卡片">
          <div class="tag" id="currentPossessionTag">SEQ #1</div>
          <div class="title" id="currentPossessionTitle">加载中...</div>
          <div class="time" id="currentPossessionTime">耗时: 0.0s / 0.0s</div>
          <span class="collapse-hint" id="collapseHint">▾ 隐藏视图</span>
        </div>
        <div class="canvas-box" id="courtContainer">
          <canvas id="court" width="760" height="405"></canvas>
        </div>

        <div class="timeline-bar">
          <input type="range" id="frameSlider" min="0" max="7199" value="0" />
          <div class="slider-info">
            <span id="frameLabel">Tick: 0 / 0</span>
            <span id="speedLabel">采样: 25Hz · 刚体物理</span>
          </div>
        </div>
      </main>

      <!-- Right: Decision Trace & Annotation Panel -->
      <aside class="decision-panel">
        <div class="panel-header">
          <h3 id="decisionHeaderTitle">10 个代理微观决策全景</h3>
          <span class="sub">实时评估代理意图、职责与空间效用</span>


        <!-- 10 Players Decision Grid -->
        <div class="all-players-decision" id="allPlayersDecision">
          <!-- Populated dynamically with all 10 players -->
        </div>

        <!-- Annotation / Feedback Component -->
        <div class="annotation-box">
          <div class="panel-header" style="padding: 8px 0 6px 0; border: none;">
            <h3 style="color: #f59e0b;" id="annotationHeaderTitle">✍️ 本阶段人工反馈标注</h3>
            <span class="sub">评价该阶段的拟真度，沉淀训练与调优样本</span>
          </div>

          <div class="annotate-form">
            <div class="rating-group">
              <label><input type="radio" name="stageRating" value="GOOD" checked /> ✅ 拟真自然</label>
              <label><input type="radio" name="stageRating" value="FLAW" /> ⚠️ 存在瑕疵</label>
              <label><input type="radio" name="stageRating" value="BAD" /> ❌ 严重违和</label>
            </div>

            <textarea id="annotationFeedback" placeholder="输入你对当前阶段轨迹/决策的看法与修改建议..."></textarea>

            <div class="annotate-actions">
              <button id="btnSubmitAnnotation" class="btn primary" style="width: 100%;">💾 提交并落地标注数据</button>
            </div>
            <div id="annotationStatus" class="annotation-status"></div>
          </div>
        </div>

        <div class="panel-header" style="margin-top: 10px;">
          <h3 id="eventHeaderTitle">实时事件流</h3>
        </div>
        <div class="event-stream" id="eventStream">
          <!-- Populated by events -->
        </div>
      </aside>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
