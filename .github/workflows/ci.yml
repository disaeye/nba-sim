name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full test suite & sanity net"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint_commit:
    name: lint-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Commit Message Format
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit subject: $MSG"
          if [[ "$MSG" =~ ^(Merge|Revert|fixup!|squash!) ]]; then
            exit 0
          fi
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|chore|ci)"
          PATTERN+="(\([a-zA-Z0-9_./-]+\))?: .+"
          if ! [[ "$MSG" =~ $PATTERN ]]; then
            echo "❌ Commit message does not follow Conventional Commits format."
            exit 1
          fi

  change_detection:
    name: change-detection
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust_changed }}
      core_changed: ${{ steps.filter.outputs.core_changed }}
      is_full: ${{ steps.detect_full.outputs.is_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve green CI baseline
        id: baseline
        run: |
          # 变更基线是「当前分支最近一次 CI 全绿的 commit」，
          # 而非上一次提交：大改动 commit A 失败后，紧随的小提交 B
          # 若只看 HEAD~1..HEAD 会被判为「无改动」，跳过全部测试
          # 并直接放行部署（洗白漏洞）。以绿色基线为界，基线之后
          # 的所有改动都会被验证；失败未修复就没有新基线。
          BASE=$(python3 scripts/ci_baseline.py --baseline)
          if [ -z "$BASE" ]; then
            echo "baseline=FULL" >> "$GITHUB_OUTPUT"
            echo "无绿色基线，本次按全量处理"
          else
            echo "baseline=$BASE" >> "$GITHUB_OUTPUT"
            echo "绿色基线: $BASE"
            git diff --name-only "$BASE..HEAD" || true
          fi
      - name: Check for [full] flag
        id: detect_full
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          if [ "$BASELINE" = "FULL" ]; then
            RANGE="HEAD"
          else
            RANGE="$BASELINE..HEAD"
          fi
          MSG=$(git log --pretty=%B $RANGE)
          if [[ "$MSG" =~ \[full\] ]] || \
             [[ "$FORCE_FULL" == "true" ]]; then
            echo "is_full=true" >> $GITHUB_OUTPUT
          else
            echo "is_full=false" >> $GITHUB_OUTPUT
          fi
      - name: Detect Changed Paths
        id: filter
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          # 基线之后的全部改动（含基线即 HEAD 时的空集）。
          if [ "$BASELINE" = "FULL" ]; then
            DIFF=$(git ls-files)
          else
            DIFF=$(git diff --name-only "$BASELINE..HEAD")
          fi
          echo "Changed files (since $BASELINE): $DIFF"
          if echo "$DIFF" | grep -qE '\.rs$|Cargo\.(toml|lock)'; then
            echo "rust_changed=true" >> $GITHUB_OUTPUT
          else
            echo "rust_changed=false" >> $GITHUB_OUTPUT
          fi
          CORE_PATTERN='^crates/(engine|physics|decision|officiating|domain)/'
          if echo "$DIFF" | grep -qE "$CORE_PATTERN"; then
            echo "core_changed=true" >> $GITHUB_OUTPUT
          else
            echo "core_changed=false" >> $GITHUB_OUTPUT
          fi

  guards:
    name: Guard (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        include:
          - name: inline-constants
            script: scripts/check_inline_constants.py
            self_test: true
          - name: no-index-identity
            script: scripts/check_no_index_identity.py
            self_test: true
          - name: threshold-integrity
            script: scripts/check_threshold_integrity.py
            self_test: true
          - name: world-privacy
            script: scripts/check_world_privacy.py
            self_test: true
          - name: engine-state-groups
            script: scripts/check_engine_state_groups.py
            self_test: true
          - name: docs
            script: scripts/check_docs.py
            self_test: false
          - name: max-source-lines
            script: scripts/check_max_source_lines.py
            self_test: true
          - name: disk-budget
            script: scripts/check_disk_budget.py
            self_test: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 守卫用 HEAD~1..HEAD 取本次提交的改动清单；浅克隆下 HEAD~1 无法
          # 解析，回退分支会把整棵树当作改动，误报判定基准被修改。
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guard
        env:
          SCRIPT: ${{ matrix.script }}
          REPORT_ARG: ${{ matrix.name == 'disk-budget' && '--report' || '' }}
          RUN_SELF_TEST: ${{ matrix.self_test }}
        run: |
          python3 "$SCRIPT" $REPORT_ARG
          if [[ "$RUN_SELF_TEST" == "true" ]]; then
            python3 "$SCRIPT" --self-test
          fi
          if [[ "${{ matrix.self_test }}" == "true" ]]; then
            python3 "${{ matrix.script }}" --self-test
          fi

  clippy:
    needs: change_detection
    if: needs.change_detection.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Cargo Check & Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fast_test:
    needs: change_detection
    if: needs.change_detection.outputs.rust_changed == 'true'
    name: Tier 1 (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        include:
          - name: nba-domain
            command: cargo test -p nba-domain
          - name: nba-invariants
            command: cargo test -p nba-invariants
          - name: play-schema
            command: cargo test -p nba-domain --test play_spec
          - name: playbook-data
            command: cargo test -p nba-domain --test playbook_data
          - name: world-state-equivalence
            command: cargo test -p nba-engine --test world_state_equivalence
          - name: engine-snapshot
            command: cargo test -p nba-engine --test engine_snapshot
          - name: projection
            command: cargo test -p nba-engine --test projection
          - name: golden-hash
            command: cargo test -p nba-engine --test golden_hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Run Tier 1 target
        run: ${{ matrix.command }} -- --test-threads "$(nproc)"

  tier2_tests:
    needs: change_detection
    if: |
      needs.change_detection.outputs.is_full == 'true' ||
      needs.change_detection.outputs.core_changed == 'true'
    name: Tier 2 (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        include:
          - name: defense-responsibility-chain
            command: >-
              cargo test -p nba-decision --test
              defense_responsibility_chain
          - name: attribute-perturbation
            command: cargo test -p nba-engine --test attribute_perturbation
          - name: block
            command: cargo test -p nba-engine --test block
          - name: decision-wiring
            command: cargo test -p nba-engine --test decision_wiring
          - name: defense
            command: cargo test -p nba-engine --test defense
          - name: rules-complete-wiring
            command: cargo test -p nba-engine --test rules_complete_wiring
          - name: wiring-proof
            command: cargo test -p nba-engine --test wiring_proof
          - name: defense-effect
            command: cargo test -p nba-engine --test defense_effect
          - name: fiba-scenarios
            command: cargo test -p nba-engine --test fiba_scenarios
          - name: play-selector
            command: cargo test -p nba-decision --test play_selector
          - name: play-actions
            command: cargo test -p nba-decision --test play_actions
          - name: play-decision
            command: cargo test -p nba-decision --test play_decision
          - name: playbook-setup
            command: cargo test -p nba-engine --test playbook_setup
          - name: action-phase-projection
            command: cargo test -p nba-engine --test action_phase_projection
          - name: shot-release-timing
            command: cargo test -p nba-engine --test shot_release_timing
          - name: identity-projection
            command: cargo test -p nba-engine --test identity_projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Run Tier 2 target
        run: ${{ matrix.command }} -- --test-threads "$(nproc)"

  d26_test:
    needs: [change_detection, tier2_tests]
    if: |
      needs.change_detection.outputs.is_full == 'true' ||
      needs.change_detection.outputs.core_changed == 'true'
    name: D26 full-game response
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Run D26 full-game response target exclusively
        run: >-
          python3 scripts/par_test.py --include
          '^nba-engine::defense_rotation_response$' --serial
          '^nba-engine::defense_rotation_response$' --jobs 1
          --threads-per-bin 1

  tier3_tests:
    needs: [change_detection, d26_test]
    if: |
      needs.change_detection.outputs.is_full == 'true' ||
      needs.change_detection.outputs.core_changed == 'true'
    name: Tier 3 (stats baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Run Tier 3 macro sanity net
        run: >-
          cargo test -p nba-engine --test stats_baseline -- --nocapture
          --test-threads "$(nproc)"

  full_gate:
    name: full-gate
    needs:
      - lint_commit
      - change_detection
      - clippy
      - fast_test
      - tier2_tests
      - d26_test
      - tier3_tests
    if: |
      always() &&
      (needs.change_detection.outputs.is_full == 'true' ||
       needs.change_detection.outputs.core_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Verify parallel test jobs
        env:
          LINT_RESULT: ${{ needs.lint_commit.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          FAST_TEST_RESULT: ${{ needs.fast_test.result }}
          TIER2_RESULT: ${{ needs.tier2_tests.result }}
          D26_RESULT: ${{ needs.d26_test.result }}
          TIER3_RESULT: ${{ needs.tier3_tests.result }}
        run: |
          for result in "$LINT_RESULT" "$CLIPPY_RESULT" "$FAST_TEST_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required prerequisite failed: $result"
              exit 1
            fi
          done
          if [[ "$TIER2_RESULT" != "success" ]] ||
             [[ "$D26_RESULT" != "success" ]] ||
             [[ "$TIER3_RESULT" != "success" ]]; then
            printf 'Full-gate jobs did not all pass:\n'
            printf 'Tier 2=%s, D26=%s, Tier 3=%s\n' \
              "$TIER2_RESULT" "$D26_RESULT" "$TIER3_RESULT"
            exit 1
          fi
          echo "All parallel full-gate jobs passed."

  deploy:
    needs:
      - lint_commit
      - change_detection
      - guards
      - clippy
      - fast_test
      - full_gate
      - d26_test
    if: >-
      always() &&
      needs.lint_commit.result == 'success' &&
      needs.change_detection.result == 'success' &&
      needs.guards.result == 'success' &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
      (needs.fast_test.result == 'success' ||
       needs.fast_test.result == 'skipped') &&
      (needs.full_gate.result == 'success' ||
       needs.full_gate.result == 'skipped') &&
      (needs.d26_test.result == 'success' ||
       needs.d26_test.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WASM (if Rust changed)
        if: needs.change_detection.outputs.rust_changed == 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          cd crates/bball-wasm
          npx --yes wasm-pack build --target web \
            --out-dir ../debug-server/static/wasm --release
      - name: Deploy to Vercel
        run: |
          npx --yes vercel deploy --prod --yes \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
