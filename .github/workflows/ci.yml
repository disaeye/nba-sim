name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full test suite & sanity net"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Commit Message Format
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit subject: $MSG"
          if [[ "$MSG" =~ ^(Merge|Revert|fixup!|squash!) ]]; then
            exit 0
          fi
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\([a-zA-Z0-9_\.\/-]+\))?: .+"
          if ! [[ "$MSG" =~ $PATTERN ]]; then
            echo "❌ Commit message does not follow Conventional Commits format."
            exit 1
          fi

  change-detection:
    needs: lint-commit
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust_changed }}
      core_changed: ${{ steps.filter.outputs.core_changed }}
      is_full: ${{ steps.detect_full.outputs.is_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for [full] flag
        id: detect_full
        run: |
          MSG=$(git log -1 --pretty=%B)
          if [[ "$MSG" =~ \[full\] ]] || [[ "${{ inputs.force_full }}" == "true" ]]; then
            echo "is_full=true" >> $GITHUB_OUTPUT
          else
            echo "is_full=false" >> $GITHUB_OUTPUT
          fi
      - name: Detect Changed Paths
        id: filter
        run: |
          DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files: $DIFF"
          if echo "$DIFF" | grep -qE '\.rs$|Cargo\.(toml|lock)'; then
            echo "rust_changed=true" >> $GITHUB_OUTPUT
          else
            echo "rust_changed=false" >> $GITHUB_OUTPUT
          fi
          if echo "$DIFF" | grep -qE '^crates/(engine|physics|decision|officiating|domain)/'; then
            echo "core_changed=true" >> $GITHUB_OUTPUT
          else
            echo "core_changed=false" >> $GITHUB_OUTPUT
          fi

  fast-test:
    needs: change-detection
    if: needs.change-detection.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Check & Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tier 1 Fast Invariant & Isolation Tests
        run: |
          cargo test -p nba-domain
          cargo test -p nba-invariants
          cargo test -p nba-engine --test step_phases_isolation
          cargo test -p nba-engine --test engine_snapshot
          cargo test -p nba-engine --test rules_consumption
          cargo test -p nba-engine --test golden_hash

  full-gate:
    needs: [change-detection, fast-test]
    if: |
      needs.change-detection.outputs.is_full == 'true' ||
      needs.change-detection.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tier 2 Mechanism & Causal Tests
        run: |
          cargo test -p nba-decision --test defense_responsibility_chain
          cargo test -p nba-engine --test attribute_perturbation
          cargo test -p nba-engine --test defense_effect
          cargo test -p nba-engine --test fiba_scenarios
      - name: Tier 3 Macro Sanity Net (8-seed full game)
        run: |
          cargo test -p nba-engine --test stats_baseline -- --nocapture

  deploy:
    needs: [change-detection, fast-test, full-gate]
    if: |
      always() &&
      (needs.change-detection.result == 'success') &&
      (needs.fast-test.result == 'success' || needs.fast-test.result == 'skipped') &&
      (needs.full-gate.result == 'success' || needs.full-gate.result == 'skipped') &&
      (github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WASM (if Rust changed)
        if: needs.change-detection.outputs.rust_changed == 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          cd crates/bball-wasm
          npx --yes wasm-pack build --target web --out-dir ../debug-server/static/wasm --release
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
