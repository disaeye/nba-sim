name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    # 纯文档推送不唤醒主流水线：docs 守卫由独立的 docs.yml 负责，
    # 应用部署也不消费文档内容。开发期 WIP 提交可在提交信息带 [skip ci]。
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full test suite & sanity net"
        type: boolean
        default: false

permissions:
  contents: read
  # 绿色基线解析需要查询 Actions 运行历史（gh run list）。
  actions: read

env:
  # gh CLI 需要 token 才能解析「最近一次绿色 CI 基线」；
  # 没有它，基线解析失败退化为全量模式，防护仍成立但轻量路径失效。
  GH_TOKEN: ${{ github.token }}

jobs:
  lint_commit:
    name: lint-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 按绿色基线逐 commit 校验提交信息，需要完整历史。
          fetch-depth: 0
      - name: Validate Commit Message Format
        run: |
          BASE=$(python3 scripts/ci_baseline.py --baseline)
          if [ -n "$BASE" ]; then RANGE="$BASE..HEAD"; else RANGE="-1"; fi
          echo "Auditing message range: $RANGE"
          mapfile -t SUBJECTS < <(git log --pretty=%s $RANGE)
          echo "Commit subjects: ${#SUBJECTS[@]}"
          for MSG in "${SUBJECTS[@]}"; do
            echo "  - $MSG"
            if [[ "$MSG" =~ ^(Merge|Revert|fixup!|squash!) ]]; then
              continue
            fi
            PATTERN="^(feat|fix|docs|style|refactor|perf|test|chore|ci)"
            PATTERN+="(\([a-zA-Z0-9_./-]+\))?: .+"
            if ! [[ "$MSG" =~ $PATTERN ]]; then
              echo "❌ Bad commit message: $MSG"
              exit 1
            fi
          done

  change_detection:
    name: change-detection
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust_changed }}
      core_changed: ${{ steps.filter.outputs.core_changed }}
      is_full: ${{ steps.detect_full.outputs.is_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve green CI baseline
        id: baseline
        run: |
          # 变更基线是「当前分支最近一次 CI 全绿的 commit」，
          # 而非上一次提交：大改动 commit A 失败后，紧随的小提交 B
          # 若只看 HEAD~1..HEAD 会被判为「无改动」，跳过全部测试
          # 并直接放行部署（洗白漏洞）。以绿色基线为界，基线之后
          # 的所有改动都会被验证；失败未修复就没有新基线。
          BASE=$(python3 scripts/ci_baseline.py --baseline)
          if [ -z "$BASE" ]; then
            echo "baseline=FULL" >> "$GITHUB_OUTPUT"
            echo "无绿色基线，本次按全量处理"
          else
            echo "baseline=$BASE" >> "$GITHUB_OUTPUT"
            echo "绿色基线: $BASE"
            git diff --name-only "$BASE..HEAD" || true
          fi
      - name: Check for [full] flag
        id: detect_full
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          if [ "$BASELINE" = "FULL" ]; then
            RANGE="HEAD"
          else
            RANGE="$BASELINE..HEAD"
          fi
          MSG=$(git log --pretty=%B $RANGE)
          if [[ "$MSG" =~ \[full\] ]] || \
             [[ "$FORCE_FULL" == "true" ]]; then
            echo "is_full=true" >> $GITHUB_OUTPUT
          else
            echo "is_full=false" >> $GITHUB_OUTPUT
          fi
      - name: Detect Changed Paths
        id: filter
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          # 基线之后的全部改动（含基线即 HEAD 时的空集）。
          if [ "$BASELINE" = "FULL" ]; then
            DIFF=$(git ls-files)
          else
            DIFF=$(git diff --name-only "$BASELINE..HEAD")
          fi
          echo "Changed files (since $BASELINE): $DIFF"
          if echo "$DIFF" | grep -qE '\.rs$|Cargo\.(toml|lock)'; then
            echo "rust_changed=true" >> $GITHUB_OUTPUT
          else
            echo "rust_changed=false" >> $GITHUB_OUTPUT
          fi
          CORE_PATTERN='^crates/(domain|protocol|sim|validation|debug-server|cli|bball-wasm)/'
          if echo "$DIFF" | grep -qE "$CORE_PATTERN"; then
            echo "core_changed=true" >> $GITHUB_OUTPUT
          else
            echo "core_changed=false" >> $GITHUB_OUTPUT
          fi

  guards:
    # 八合一：脚本本身都是秒级，分列 job 时每个各自付一遍
    # checkout + Python 环境的固定开销；合并后一份开销顺序执行全部。
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 守卫按「绿色基线之后的所有 commit」逐个审计，基线可能早于
          # HEAD~1；浅克隆下基线对象缺失会让解析退化为仅审计 HEAD，
          # 多 commit 洗白就从这个缺口漏过去。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guards
        run: |
          set -e
          python3 scripts/check_inline_constants.py
          python3 scripts/check_inline_constants.py --self-test
          python3 scripts/check_no_index_identity.py
          python3 scripts/check_no_index_identity.py --self-test
          python3 scripts/check_threshold_integrity.py
          python3 scripts/check_threshold_integrity.py --self-test
          python3 scripts/check_r6_tendency_wiring.py
          python3 scripts/calibrate/freeze.py --check
          python3 scripts/check_docs.py
          python3 scripts/check_max_source_lines.py
          python3 scripts/check_max_source_lines.py --self-test
          python3 scripts/check_disk_budget.py --report

  clippy:
    needs: change_detection
    if: needs.change_detection.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Cargo Check & Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fast_test:
    needs: change_detection
    if: needs.change_detection.outputs.rust_changed == 'true'
    name: Tier 1 (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        include:
          # play_spec 与 playbook_data 不单列：`cargo test -p nba-domain`
          # 全包已覆盖，重复跑只是多付一份固定开销。
          - name: nba-domain
            command: cargo test -p nba-domain
          - name: nba-protocol
            command: cargo test -p nba-protocol
          - name: nba-sim-core
            command: cargo test -p nba-sim-core
          - name: nba-wasm
            command: cargo test -p nba-wasm
          - name: nba-validation-mechanism
            command: cargo test -p nba-validation --test mechanism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Run Tier 1 target
        run: ${{ matrix.command }} -- --test-threads "$(nproc)"

  tier2_tests:
    needs: change_detection
    if: |
      needs.change_detection.outputs.is_full == 'true' ||
      needs.change_detection.outputs.core_changed == 'true'
    name: Tier 2 (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        include:
          # 按包合并：每个测试单列一个 job 时，固定开销（checkout + 工具链
          # + 缓存恢复 + 编译链接）比测试本身还贵。
          - name: nba-debug-server
            command: cargo test -p nba-debug-server
          - name: nba-validation
            command: cargo test -p nba-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Run Tier 2 target
        run: ${{ matrix.command }} -- --test-threads "$(nproc)"

  tier3_tests:
    needs: [change_detection, tier2_tests]
    if: |
      needs.change_detection.outputs.is_full == 'true' ||
      needs.change_detection.outputs.core_changed == 'true'
    name: Tier 3 (batch validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure runner parallelism
        run: |
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "CARGO_BUILD_JOBS=${CPUS}" >> "$GITHUB_ENV"
      - name: Run action-chain batch validation
        run: |
          cargo build --release -p nba-sim-cli
          set +e
          ./target/release/nba-sim validate-core --seed 1 --games 32 --mechanism \
            --out .work/validation-view
          CODE=$?
          set -e
          # 1 = 存在缺陷或未登记的不足，2 = 执行错误，两者都必须阻断；
          # 3 = 只有已登记在 data/calibration/known_insufficient.json 的不足，
          # 属于待补数据/待接属性的工作清单，降为告警。
          if [ "$CODE" -eq 3 ]; then
            echo "::warning::action-chain validation reports insufficient evidence"
          elif [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi

  full_gate:
    name: full-gate
    needs:
      - lint_commit
      - change_detection
      - clippy
      - fast_test
      - tier2_tests
      - tier3_tests
    if: |
      always() &&
      (needs.change_detection.outputs.is_full == 'true' ||
       needs.change_detection.outputs.core_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Verify parallel test jobs
        env:
          LINT_RESULT: ${{ needs.lint_commit.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          FAST_TEST_RESULT: ${{ needs.fast_test.result }}
          TIER2_RESULT: ${{ needs.tier2_tests.result }}
          TIER3_RESULT: ${{ needs.tier3_tests.result }}
        run: |
          for result in "$LINT_RESULT" "$CLIPPY_RESULT" "$FAST_TEST_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required prerequisite failed: $result"
              exit 1
            fi
          done
          if [[ "$TIER2_RESULT" != "success" ]] ||
             [[ "$TIER3_RESULT" != "success" ]]; then
            printf 'Full-gate jobs did not all pass:\n'
            printf 'Tier 2=%s, Tier 3=%s\n' \
              "$TIER2_RESULT" "$TIER3_RESULT"
            exit 1
          fi
          echo "All parallel full-gate jobs passed."

  deploy:
    needs:
      - lint_commit
      - change_detection
      - guards
      - clippy
      - fast_test
      - full_gate
    if: >-
      always() &&
      needs.lint_commit.result == 'success' &&
      needs.change_detection.result == 'success' &&
      needs.guards.result == 'success' &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
      (needs.fast_test.result == 'success' ||
       needs.fast_test.result == 'skipped') &&
      (needs.full_gate.result == 'success' ||
       needs.full_gate.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WASM (if Rust changed)
        if: needs.change_detection.outputs.rust_changed == 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          cd crates/bball-wasm
          npx --yes wasm-pack build --target web \
            --out-dir ../debug-server/static/wasm --release
      - name: Deploy to Vercel
        run: |
          npx --yes vercel deploy --prod --yes \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
