name: docs

on:
  push:
    paths:
      - "docs/**"
      - "scripts/check_doc_refs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_doc_refs.py"
      - ".github/workflows/docs.yml"

jobs:
  check-doc-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cross-document section references
        run: python3 scripts/check_doc_refs.py
